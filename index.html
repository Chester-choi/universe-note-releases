<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Universe Note</title>
  <link rel="icon" href="icon.png" />
  <style>
    :root { --bg:#fbfaf7; --text:#2f2d29; --muted:#6f6b63; --line:#e7e3da; --accent:#6b5fc4; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1c1b1f; --text:#ecebe8; --muted:#a19d96; --line:#34323a; --accent:#a99cf2; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.75 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
    header { display:flex; align-items:center; gap:14px; margin-bottom: 28px; }
    header img { width:56px; height:56px; }
    header a { color: inherit; text-decoration: none; font-weight: 700; font-size: 20px; }
    h1 { font-size: 28px; margin: 0 0 6px; line-height: 1.35; }
    h2 { font-size: 18px; margin: 34px 0 6px; }
    p, li { color: var(--text); }
    .muted { color: var(--muted); font-size: 14px; }
    ul { padding-left: 20px; }
    a { color: var(--accent); }
    nav { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; display:flex; gap:16px; flex-wrap: wrap; }
  </style>
</head>
<body>
<main>
  <header><img src="icon.png" alt="" /><a href="./">Universe Note</a></header>
  <h1>업무 노트, 일정, 할 일을 한 화면에</h1>
  <p>Universe Note는 업무 기록과 캘린더, 할 일을 한 화면에서 관리하는 Mac용 노트 앱이에요. 노트는 내 Mac과 내 iCloud에만 저장되고, 가입도 광고도 없어요.</p>
  <ul>
    <li>Mac에 연결된 iCloud·구글·회사 캘린더와 미리 알림을 그대로</li>
    <li>일정에서 바로 회의 노트 만들기</li>
    <li>쉬었다가 다시 쓰면 날짜가 붙는 기록, 형광펜 하이라이트</li>
    <li>iCloud 동기화와 자동 백업</li>
  </ul>

  <nav><a href="./">소개</a><a href="support.html">지원</a><a href="privacy.html">개인정보처리방침</a><a href="https://github.com/Chester-choi/universe-note-releases/releases/latest">Mac용 설치 파일</a></nav>
</main>
</body>
</html>
